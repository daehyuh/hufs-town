          category,
          source,
          layer,
          status,
        ]
      properties:
        id: { type: string, pattern: "^custom_[0-9a-fA-F-]{36}$" }
        name: { type: string, maxLength: 180 }
        url: { type: string, format: uri-reference }
        thumbnailUrl: { type: string, format: uri-reference }
        width: { type: integer, minimum: 1, maximum: 512 }
        height: { type: integer, minimum: 1, maximum: 512 }
        footprint: { type: [object, "null"] }
        category: { type: string, const: 사용자 에셋 }
