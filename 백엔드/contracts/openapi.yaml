              { type: string, enum: [PENDING, APPROVED, REJECTED, ""] }
            favorite:
              {
                type: boolean,
                description: Whether the authenticated user saved this space.,
              }
            archived:
              {
                type: boolean,
                description: True when returned by the owner's archived-space view.,
              }
