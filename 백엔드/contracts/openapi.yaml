    RoomReservationRoom:
      type: object
      required: [mapId, mapName, zoneId, zoneName, capacity]
      properties:
        mapId: { type: string, format: uuid }
        mapName: { type: string, maxLength: 60 }
        zoneId:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9_-]+$",
          }
        zoneName: { type: string, maxLength: 40 }
        capacity:
          { type: [integer, "null"], format: int64, minimum: 1, maximum: 100 }
    RoomReservation:
      type: object
      required:
        [
          id,
          mapId,
          zoneId,
          mapName,
          zoneName,
          roomAvailable,
          title,
          organizerName,
          mine,
          canEdit,
          startsAt,
          endsAt,
          cancelledAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        mapId: { type: string, format: uuid }
        zoneId:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9_-]+$",
          }
        mapName:
          {
            type: string,
            maxLength: 60,
            description: Falls back to '삭제된 지도' if the original map is no longer published.,
          }
        zoneName:
          {
            type: string,
            maxLength: 40,
            description: Falls back to '삭제된 회의실' if the original room is no longer published.,
          }
        roomAvailable:
          {
            type: boolean,
            description: Whether the room still exists in a published map.,
          }
        title: { type: string, maxLength: 80 }
        organizerName: { type: string, maxLength: 20 }
        mine:
          {
            type: boolean,
            description: Whether the authenticated user organized this reservation.,
          }
        canEdit:
          {
            type: boolean,
            description: Whether the authenticated user may edit or cancel this reservation.,
          }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cancelledAt:
          description: Empty string when the reservation has not been cancelled.
          oneOf:
            - { type: string, format: date-time }
            - { type: string, maxLength: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoomReservationSnapshot:
      type: object
      required: [rooms, reservations, canReserve]
      properties:
        rooms:
          type: array
          items: { $ref: "#/components/schemas/RoomReservationRoom" }
        reservations:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/RoomReservation" }
        canReserve:
          {
            type: boolean,
            description: True when the caller is a current member of the space.,
          }
    RoomReservationDraft:
      type: object
      required: [requestId, mapId, zoneId, title, startsAt, endsAt]
      properties:
        requestId:
          {
            type: string,
            format: uuid,
            description: Required by both create and update request DTOs; create uses it as the idempotency key.,
          }
        mapId: { type: string, format: uuid }
        zoneId:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9_-]+$",
          }
        title: { type: string, minLength: 1, maxLength: 80 }
        startsAt:
          {
            type: string,
            format: date-time,
            description: Must be from 2 minutes to 365 days ahead.,
          }
        endsAt:
          {
            type: string,
            format: date-time,
            description: Reservation duration must be from 15 minutes to 8 hours.,
          }
