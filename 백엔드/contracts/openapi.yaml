      properties:
        archived: { type: boolean }
    SpaceFavoriteState:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }
    SpacePage:
      type: object
      required:
        [items, page, pageSize, totalItems, totalPages, hasNext, hasPrevious]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Space" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }
    SpaceMember:
      type: object
      required: [userId, displayName, role, joinedAt, lastVisitedAt]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        joinedAt: { type: integer, format: int64 }
        lastVisitedAt: { type: [integer, "null"], format: int64 }
    SpaceOwnershipTransfer:
      type: object
      required:
        [spaceId, targetUserId, targetDisplayName, requestedAt, expiresAt]
      properties:
        spaceId: { type: string, format: uuid }
        targetUserId: { type: string, format: uuid }
        targetDisplayName: { type: string }
        requestedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
    IncomingOwnershipTransfer:
      type: object
      required: [spaceId, spaceName, ownerDisplayName, requestedAt, expiresAt]
      properties:
        spaceId: { type: string, format: uuid }
        spaceName: { type: string }
        ownerDisplayName: { type: string }
        requestedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
    IncomingSpaceInvite:
      type: object
      required:
        [
          inviteId,
          spaceId,
          spaceName,
          inviterDisplayName,
          ownerDisplayName,
          createdAt,
          expiresAt,
        ]
      properties:
        inviteId: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        spaceName: { type: string }
        inviterDisplayName: { type: string }
        ownerDisplayName: { type: string }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
    OwnershipTransferResult:
      type: object
      required: [status]
      properties:
        status:
          { type: string, enum: [ACCEPTED, DECLINED, EXPIRED, UNAVAILABLE] }
    SpaceAccessBlock:
      type: object
      required: [userId, displayName, blockedAt]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        blockedAt: { type: integer, format: int64 }
    SpaceJoinRequest:
      type: object
      required: [id, userId, displayName, requestedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        requestedAt: { type: integer, format: int64 }
    IncomingSpaceJoinRequest:
      type: object
      required: [spaceId, spaceName, request]
      properties:
        spaceId: { type: string, format: uuid }
        spaceName: { type: string }
        request: { $ref: "#/components/schemas/SpaceJoinRequest" }
    SpaceJoinRequestState:
      type: object
      required: [status, requestedAt]
      properties:
        status: { type: string, enum: [PENDING, MEMBER] }
        requestedAt: { type: integer, format: int64 }
    SocialJoinRequest:
      type: object
      required:
        [
          id,
          displayName,
          message,
          status,
          requestedAt,
          expiresAt,
          destinationSpaceId,
          destinationSpaceName,
        ]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        message: { type: string, maxLength: 160 }
        status:
          {
            type: string,
            enum: [PENDING, APPROVED, DECLINED, CANCELLED, EXPIRED],
          }
        requestedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        destinationSpaceId: { type: string, format: uuid, nullable: true }
        destinationSpaceName: { type: string, maxLength: 60, nullable: true }
    SocialJoinRequestState:
      type: object
      required: [id, status, requestedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING] }
        requestedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
    Invite:
      type: object
      required: [id, expiresAt, maxUses, useCount, revoked]
      properties:
        id: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 100 }
        useCount: { type: integer, minimum: 0, maximum: 100 }
        revoked: { type: boolean }
    ChatHistoryEntry:
      type: object
      required:
        [
          type,
          messageId,
          clientMessageId,
          channel,
          senderId,
          senderName,
          avatar,
          text,
          sentAt,
          zoneId,
          own,
        ]
      properties:
        type: { type: string, const: chatEvent }
        messageId: { type: string, format: uuid }
        clientMessageId: { type: string, maxLength: 64 }
        channel: { type: string, enum: [nearby, room] }
        senderId: { type: string, format: uuid }
        senderName: { type: string }
        avatar: { type: integer, minimum: 0, maximum: 2 }
        text: { type: string, maxLength: 500 }
        sentAt: { type: integer, format: int64 }
        zoneId: { type: string, maxLength: 64 }
        own:
          {
            type: boolean,
            description: Whether this message was authored by the authenticated account.,
          }
    Account:
      type: object
      required: [userId, displayName, avatar, allowPokes]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        avatar: { type: integer, minimum: 0, maximum: 2 }
        allowPokes:
          {
            type: boolean,
            description: Whether other participants may send the account a poke.,
          }
    AccountDeletionImpact:
      type: object
      required: [ownedSpaces]
      properties:
        ownedSpaces:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, maxLength: 60 }
    AuthError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    MapEditor:
      description: Saved draft and publication validation issues.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MapEditor" }
    MapError:
      description: 400 invalid map/publication; 401 missing session; 403 owner/account/CSRF denied; 404 space/revision unavailable; 409 lease/version/operation conflict; 413 body exceeds 512000 bytes; 503 storage unavailable. Existing publication remains intact on validation failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthError" }
    Space:
      description: Space metadata and the caller's role.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Space" }
    SpaceJoinRequestState:
      description: Current account's request state. MEMBER means the account already has membership.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SpaceJoinRequestState" }
    SpaceFavoriteState:
      description: Current account's saved favorite state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SpaceFavoriteState" }
    SpaceArchiveState:
      description: Current archive state after the owner's archive or restore request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SpaceArchiveState" }
    SpacePage:
      description: Visible spaces for the requested server-side filter and page.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SpacePage" }
    SpaceError:
      description: 400 invalid input/invite/event date; 401 session missing; 403 owner/account/CSRF/approval/access-block denied; 404 missing or private space; 409 quota/request/event/ownership-transfer/archive conflict; 429 per-account rate or daily event limit; 503 storage unavailable. Uses the common code/message shape.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthError" }
    AuthError:
      description: Authentication, policy, CSRF, rate limit, configuration or provider failure. No upstream body or secret is returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthError" }
