name: HUFS Town checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Production source installer safety
        run: python3 백엔드/scripts/test-production-source-install.py
      - name: Production release scripts syntax
        run: bash -n 백엔드/scripts/deploy-production.sh 백엔드/scripts/rollback-production.sh 백엔드/scripts/prune-production-releases.sh 백엔드/scripts/configure-production-vapid.sh
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          package_json_file: 프론트/package.json
      - name: Web contracts, tests and build
        working-directory: 프론트
        run: |
          pnpm install --frozen-lockfile
          pnpm contracts:check
          pnpm test
          pnpm build
      - name: Java tests and real database integration
        working-directory: 백엔드
        run: bash gradlew test :modules:persistence:integrationTest :apps:api:integrationTest :apps:api:bootJar :apps:world:bootJar --no-daemon
      - name: Native media worker tests
        working-directory: 백엔드/apps/media
        run: |
          npm ci
          npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          include-hidden-files: true
          path: |
            .build/backend/**/reports/
            프론트/test-results/
            프론트/playwright-report/
            *.log
